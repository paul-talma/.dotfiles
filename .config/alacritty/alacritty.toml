
[cursor]
unfocused_hollow = true

[cursor.style]
blinking = "On"

[colors]
cursor = { text = "CellBackground", cursor = "#FFFFDB" }

[env]
TERM = "xterm-256color"

[font]
size = 28

# JetBrains Mono
[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular" 

[scrolling]
# auto_scroll = true
# history = 2000

[window]
decorations = "buttonless"
opacity = 0.99999
# option_as_alt = "OnlyLeft"

[window.dimensions]
columns = 70
lines = 20

[window.padding]
x = 0
y = 0

[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"

[general]
live_config_reload = true
import = [
  "themes/themes/retrobox.toml",
  # "themes/themes/gruvppuccin.toml",
  # "themes/themes/gruvbox_material.toml",
  # "themes/themes/everforest_dark.toml",
]


